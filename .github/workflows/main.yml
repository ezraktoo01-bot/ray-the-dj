name: RAY THE DJ Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: unzip -o RAY_THE_DJ_Android.zip

      - name: Build APK
        working-directory: RAY_THE_DJ_Android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RAY-THE-DJ-APK
          path: RAY_THE_DJ_Android/app/build/outputs/apk/debug/app-debug.apk
